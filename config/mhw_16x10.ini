[Fix]
Enabled=true
AutoDetectAspect=true
Width=1280
Height=800
RemoveLetterbox=true
; Keep menus on the engine's 16:9 size pair. The settlement background
; field is still expanded to the full output.
KeepUi16x9=true

[Loader]
; Leave ChainLoad empty to load dinput8_chain.dll automatically when that
; file sits beside MonsterHunterWorld.exe. Stracker's Loader and ICE resolve
; dinput8.dll by name, so their DirectInput8Create export is not forwarded.
; cryptbase.dll in the game directory is loaded as well, which is what keeps
; ICE on SAVEDATA_ICE. Set ChainLoad to another DLL to override the automatic
; file. Set it to a single hyphen to load nothing.
ChainLoad=
ForwardDirectInput8Create=true

[Debug]
EnableLog=true
TraceCompletionLayout=false

; Experimental completion-screen background overrides.
;
; The native aspect fix already rebuilds every layout field to the real output
; size, but two dword pairs in the render manager keep the 16:9 size. A 512 KB
; sweep at 1920x1200 found these are the ONLY fields left holding 1080.
;
; 0 means "leave the game's value alone". Nothing below is applied by default,
; so shipping this file changes nothing until you edit it.
;
; Restart the game after editing. Writing these fields from outside while a
; screen is already visible is not a reliable test.
;
; Candidate experiments, one at a time (see docs/COMPLETION_SCREEN_ANALYSIS.md):
;
;   A. Only the UI reference height, at 1920x1200:
;        UiReferenceHeight=1200
;      Status: NOT YET CLEANLY TESTED. An earlier session thought this broke
;      HUD placement, but that was a misreading: the game natively has two R/F
;      prompt sets, one below the item bar on the right, and activating it
;      spawns another in the middle. Nothing proved the HUD moved. Re-test and
;      judge the background only.
;
;   B. Only the secondary pair:
;        SecondaryLayoutHeight=1200
;
;   C. Scale both axes so the ratio stays 16:9 and any aspect-derived HUD
;      anchors keep their factor, while the canvas grows to cover the screen:
;        UiReferenceWidth=2133
;        UiReferenceHeight=1200
;
;   Also worth trying without any override here: set
;   "Ultrawide Mode UI Layout=1" in graphics_option.ini, since the game has its
;   own non-16:9 HUD layout mode.

[Experimental]
UiReferenceWidth=0
UiReferenceHeight=0
SecondaryLayoutWidth=0
SecondaryLayoutHeight=0

; Promote 16:9-shaped textures to the full output height at the D3D12
; allocation boundary (CreateCommittedResource).
;
; Why this exists: the stale-16:9 height is NOT stored in any struct field.
; On 2026-08-07 all four dword pairs above were forced to the native height and
; verified to hold, a 512 KB sweep of the render manager found no remaining
; 16:9 value and no hardcoded 1.7778 float, and the game still allocated 44
; textures at 1920x1080. A 2240x1463 session settled it by producing 2240x1260
; textures: 2240/1.7778 = 1260, a height matching no window and no display
; mode, so it can only be computed in code.
;
; Every such texture still has to pass through CreateCommittedResource, so the
; allocation is widened there instead of hunting the instruction that does the
; division.
;
; Caveat: this only changes the ALLOCATION. If the engine keeps computing
; viewports and UVs from its own 16:9 numbers, the extra rows may simply hold
; garbage rather than fixing the image. Treat the result as an experiment and
; check the log line "Promoted widescreen texture #N".
PromoteWidescreenTextures=false

